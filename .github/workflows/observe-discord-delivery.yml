name: Observe natural Discord reminder delivery
on:
  push:
    branches: [codex/line-boss-handoff]
    paths: ['scripts/observe-discord-delivery.mjs', '.github/workflows/observe-discord-delivery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Watch a natural scheduled reminder without sending test messages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/observe-discord-delivery.mjs
