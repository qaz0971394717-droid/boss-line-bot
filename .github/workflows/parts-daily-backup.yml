name: Parts D1 daily verified backup
on:
  schedule:
    - cron: '45 21 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/parts-daily-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: parts-d1-daily-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/line-boss-handoff
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: cloudflare-migration
      - run: python3 -m pip install boto3
      - name: Back up and verify parts database
        id: backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          WRANGLER_SEND_METRICS: 'false'
        run: python3 scripts/backup-parts-d1.py
      - name: Record backup or capacity alert
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BACKUP_STATUS: ${{ steps.backup.outcome }}
        run: node scripts/parts-backup-status.mjs
