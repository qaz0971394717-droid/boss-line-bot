name: Deploy production LINE bot

on:
  push:
    branches:
      - codex/line-boss-handoff
    paths:
      - 'cloudflare-migration/**'
      - '.github/workflows/deploy-production-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hit2-boss-production-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare-migration/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Check production bundle
        run: npx wrangler deploy --dry-run --config wrangler.production.toml
      - name: Check deployment authorization
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            const missing = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"].filter(key => !process.env[key]);
            if (missing.length) {
              console.error("::error::Deployment authorization missing: " + missing.join(", "));
              process.exit(1);
            }
          '
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.production.toml
      - name: Verify production health
        run: |
          node --input-type=module -e '
            const response = await fetch("https://hit2-boss-production.qaz0971394717.workers.dev", {signal: AbortSignal.timeout(15000)});
            if (!response.ok) throw new Error("Production health request failed");
            const health = await response.json();
            if (health.mode !== "production" || health.database_backend !== "d1" || !health.line_enabled || !health.admin_enabled || health.reminders_enabled !== false) {
              throw new Error("Production configuration verification failed");
            }
            console.log("Production Worker health verified; automatic reminders disabled.");
          '
