name: Diagnose personal memo callback
on:
  push:
    branches: [codex/line-boss-handoff]
    paths: ['.github/workflows/diagnose-memo-bot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect private callback configuration and event states
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEMO_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.MEMO_LINE_CHANNEL_ACCESS_TOKEN }}
          MEMO_OWNER_LINE_USER_ID: ${{ secrets.MEMO_OWNER_LINE_USER_ID }}
        run: |
          node --input-type=module <<'JS'
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'};
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          async function cf(path,body){const r=await fetch(root+path,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok||!d.success)throw Error('Diagnostic API unavailable');return d.result;}
          const db=(await cf('/d1/database?per_page=100')).find(x=>x.name==='hongzhe-personal-memo');if(!db)throw Error('Memo database missing');
          const rows=await cf('/d1/database/'+db.uuid+'/query',{sql:"SELECT state,count(*) n FROM memo_events GROUP BY state"});
          const times=await cf('/d1/database/'+db.uuid+'/query',{sql:"SELECT state,created_at,updated_at FROM memo_events ORDER BY created_at DESC LIMIT 5"});
          console.log('Event counts: '+JSON.stringify(rows[0].results));console.log('Recent event timings: '+JSON.stringify(times[0].results));
          const lh={Authorization:'Bearer '+process.env.MEMO_LINE_CHANNEL_ACCESS_TOKEN};
          const webhook=await (await fetch('https://api.line.me/v2/bot/channel/webhook/endpoint',{headers:lh})).json();
          console.log('Webhook: '+JSON.stringify({endpoint:webhook.endpoint,active:webhook.active}));
          const user=process.env.MEMO_OWNER_LINE_USER_ID||'';
          const profile=await fetch('https://api.line.me/v2/bot/profile/'+encodeURIComponent(user),{headers:lh});
          console.log('Configured owner profile reachable HTTP '+profile.status);
          const bot=await (await fetch('https://api.line.me/v2/bot/info',{headers:lh})).json();console.log('Bot name: '+bot.displayName);
          const health=await (await fetch('https://hongzhe-personal-memo.qaz0971394717.workers.dev')).json();console.log('Health: '+JSON.stringify(health));
          JS
