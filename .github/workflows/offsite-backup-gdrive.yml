name: Offsite backup to Google Drive
on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test LINE alert (and skip the backup)'
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
concurrency:
  group: offsite-backup-gdrive
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tools
        if: ${{ !inputs.test_alert }}
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/w" wrangler@4
          echo "$RUNNER_TEMP/w/node_modules/.bin" >> "$GITHUB_PATH"
          sudo apt-get install -y rclone >/dev/null
      - name: Export, verify and bundle
        if: ${{ !inputs.test_alert }}
        env:
          GH_BACKUP_TOKEN: ${{ secrets.GH_BACKUP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/offsite_backup.py
      - name: Upload to Google Drive
        if: ${{ !inputs.test_alert }}
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set +x
          [ -n "$RCLONE_CONF" ] || { echo "RCLONE_CONF secret is missing"; exit 1; }
          umask 077
          printf '%s' "$RCLONE_CONF" > "$RUNNER_TEMP/rclone.conf"
          DAY=$(date -u +%F)
          rclone copy out "gdrive:cloudflare-backup/$DAY" --config "$RUNNER_TEMP/rclone.conf" --stats-one-line -q
          rclone check out "gdrive:cloudflare-backup/$DAY" --config "$RUNNER_TEMP/rclone.conf" --download --one-way -q
          echo "uploaded and re-downloaded for comparison: $DAY"
          # large, rarely changing files: upload only when the size changed
          rclone copy static "gdrive:cloudflare-backup-static" --size-only --config "$RUNNER_TEMP/rclone.conf" --stats-one-line -q
          rclone check static "gdrive:cloudflare-backup-static" --size-only --one-way --config "$RUNNER_TEMP/rclone.conf" -q
          echo "static files ok"
          # keep 30 days of offsite copies
          rclone delete gdrive:cloudflare-backup --min-age 30d --rmdirs --config "$RUNNER_TEMP/rclone.conf" -q || true
          rm -f "$RUNNER_TEMP/rclone.conf"
      - name: Open an issue if the offsite backup failed
        if: failure() && !inputs.test_alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Offsite Google Drive backup failed $(date -u +%F)" \
            --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Alert on LINE if the backup failed
        if: failure() || inputs.test_alert
        env:
          LINE_TOKEN: ${{ secrets.MEMO_LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.MEMO_OWNER_LINE_USER_ID }}
          TEST: ${{ inputs.test_alert }}
        run: |
          set +x
          if [ "$TEST" = "true" ]; then MSG="[測試] 異地備份失敗通知功能正常"; else MSG="異地備份失敗 $(date -u +%F)，請查看 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; fi
          BODY=$(python3 -c 'import json,sys; print(json.dumps({"to":sys.argv[1],"messages":[{"type":"text","text":sys.argv[2]}]}))' "$LINE_TO" "$MSG")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.line.me/v2/bot/message/push -H "Authorization: Bearer $LINE_TOKEN" -H 'Content-Type: application/json' -d "$BODY")
          echo "LINE push status: $CODE"
          [ "$CODE" = "200" ]
