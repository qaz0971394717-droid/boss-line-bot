name: Update staging LINE worker
on:
  push:
    branches: [codex/d1-migration, codex/line-boss-handoff]
    paths: [.github/workflows/deploy-staging-worker.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hit2-boss-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-migration
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Deploy staging D1 configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.d1-staging.toml
