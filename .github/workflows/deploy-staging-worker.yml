name: Update staging LINE worker
on:
  push:
    branches: [codex/line-boss-handoff]
    paths: [.github/workflows/deploy-staging-worker.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hit2-boss-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Deploy staging with reminders disabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --var STAGING_MODE:true --var ENABLE_STAGING_LINE:true --var ENABLE_STAGING_ADMIN:true --var ENABLE_STAGING_REMINDERS:false
      - name: Verify staging flags
        run: |
          node --input-type=module <<'JS'
          const response=await fetch("https://hit2-boss-staging.qaz0971394717.workers.dev");
          if(!response.ok) throw Error("Health request failed");
          const data=await response.json();
          if(data.mode!=="staging" || !data.line_enabled || !data.admin_enabled || data.reminders_enabled) throw Error("Unexpected staging flags");
          console.log("Staging health verified; reminders remain disabled.");
          JS
