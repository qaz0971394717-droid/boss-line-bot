name: Update staging LINE worker
on:
  push:
    branches: [codex/d1-migration, codex/line-boss-handoff]
    paths:
      - '.github/workflows/deploy-staging-worker.yml'
      - 'cloudflare-migration/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hit2-boss-staging-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/line-boss-handoff
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --test ../scripts/service-backup-status.test.mjs
      - run: pip install boto3
      - name: Prepare private LINE notification relay
        env:
          PROVISION_OPS: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python3 scripts/ops-alert-key.py
          node scripts/prepare-group-access.mjs staging
          node scripts/prepare-undo.mjs
      - name: Deploy staging D1 configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.d1-staging.toml
