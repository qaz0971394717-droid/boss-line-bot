name: D1 production daily backup
on:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/d1-production-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d1-production-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-migration
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/line-boss-handoff
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: python3 -m pip install boto3
      - name: Back up production D1 to private R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          WRANGLER_SEND_METRICS: 'false'
        run: node scripts/backup-d1-production.mjs
