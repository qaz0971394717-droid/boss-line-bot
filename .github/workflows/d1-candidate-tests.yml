name: D1 migration candidate tests
on:
  push:
    branches: [codex/d1-migration]
  pull_request:
    paths:
      - 'cloudflare-migration/**'
      - '.github/workflows/d1-candidate-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run
