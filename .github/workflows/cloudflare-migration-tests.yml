name: Cloudflare migration tests

on:
  push:
    branches:
      - cloudflare-migration
    paths:
      - 'cloudflare-migration/**'
      - '.github/workflows/cloudflare-migration-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare-migration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir ./dist
