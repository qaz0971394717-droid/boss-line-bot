name: Check D1 access
on:
  push:
    branches: [codex/line-boss-handoff]
    paths: [.github/workflows/check-d1-access.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check D1 read authorization
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          req=urllib.request.Request("https://api.cloudflare.com/client/v4/accounts/"+os.environ["CF_ACCOUNT"]+"/d1/database",headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]})
          try:
              with urllib.request.urlopen(req) as response: data=json.load(response)
          except urllib.error.HTTPError as error:
              print("D1 authorization HTTP status:",error.code)
              raise SystemExit(1)
          print("D1 read authorization:",bool(data.get("success")))
          if not data.get("success"): raise SystemExit(1)
          PY
