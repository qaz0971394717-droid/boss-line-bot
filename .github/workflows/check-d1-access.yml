name: Check D1 access
on:
  push:
    branches: [codex/line-boss-handoff]
    paths: [.github/workflows/check-d1-access.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check D1 read authorization
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          base="https://api.cloudflare.com/client/v4"
          headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]}
          checks=[("token",base+"/user/tokens/verify"),("workers",base+"/accounts/"+os.environ["CF_ACCOUNT"]+"/workers/scripts"),("d1",base+"/accounts/"+os.environ["CF_ACCOUNT"]+"/d1/database")]
          okay=True
          for label,url in checks:
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req) as response:
                      status=response.status
                      data=json.load(response)
              except urllib.error.HTTPError as error:
                  status=error.code
                  try: data=json.load(error)
                  except Exception: data={}
              result={"check":label,"http":status,"success":bool(data.get("success")),"error_codes":[x.get("code") for x in data.get("errors",[])]}
              if label=="token": result["status"]=(data.get("result") or {}).get("status")
              print(json.dumps(result))
              if not data.get("success"): okay=False
          if not okay: raise SystemExit(1)
          PY
