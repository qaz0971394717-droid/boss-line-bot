name = "hit2-boss-production"
main = "src/production.js"
compatibility_date = "2026-10-01"
[vars]
ENABLE_DISCORD_KB = "true"
ENABLE_ADMIN_ACTOR_GUARD = "true"
ENABLE_DISCORD_REMINDERS = "true"
ENABLE_BIRTHDAY_SURPRISE = "false"
ENABLE_OVERWRITE_GUARD = "true"
ENABLE_UNDO_BUTTON = "true"
ENABLE_UNDO = "true"
PRODUCTION_MODE = "true"
ENABLE_LINE = "true"
ENABLE_ADMIN = "true"
DATABASE_BACKEND = "d1"
ENABLE_EVENT_ORDER_GUARD = "true"
[[d1_databases]]
binding = "BOSS_DB"
database_name = "hit2-boss-d1-production-38984686581"
database_id = "db692969-0b74-4dc5-952a-604847e15628"

[[durable_objects.bindings]]
name = "DISCORD_REMINDER"
class_name = "BossReminder"
script_name = "hit2-boss-reminder-v2"
